name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # pinned exactly; no floating major tags
        with:
          python-version: "3.10"
      - run: uv sync --frozen
      - run: uv run ruff check app/ tests/ demo/ evals/
      - run: uv run pytest -q
      - run: uv run python -m demo.export  # replays demo/cassette.jsonl, no API key
      - run: uv run python -m evals.golden  # 8 demo cases vs evals/golden.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build  # tsc + vite build
      - run: npm run build
        env:
          VITE_DEMO: "1"
          VITE_BASE: /triage-desk/
