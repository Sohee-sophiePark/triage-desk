name: pages
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - uses: astral-sh/setup-uv@v10.2.0  # pinned exactly; no floating major tags
        with:
          python-version: "3.10"
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run python -m demo.export  # replays demo/cassette.jsonl, no API key
        working-directory: backend
      - run: uv run python -m evals.golden  # never deploy a demo that fails the golden cases
        working-directory: backend
      - run: npm run build --prefix frontend
        env:
          VITE_DEMO: "1"
          VITE_BASE: /triage-desk/
      - run: cp frontend/dist/index.html frontend/dist/404.html  # SPA deep links on Pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
