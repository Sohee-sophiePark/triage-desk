# ── Production override ───────────────────────────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Overrides: resource limits, replica count, secure postgres password, HTTPS-ready

version: "3.9"

services:
  backend:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      # Override DATABASE_URL and other secrets via your CI/CD secrets manager
      # or a .env.prod file: docker compose --env-file .env.prod ...

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # Must be set in environment / secrets

  redis:
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}

  frontend:
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
